version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: explorer-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explorer-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: explorer-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explorer-network

  # Faster Indexer (replaces block-listener + indexer)
  fasterindexer:
    build:
      context: ./services/fasterindexer
      dockerfile: Dockerfile
    container_name: explorer-fasterindexer
    environment:
      RPC_URL: ${RPC_URL}
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      BATCH_SIZE: ${INDEXER_BATCH_SIZE:-1000}
      POLL_MS: ${FASTERINDEXER_POLL_MS:-200}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      START_BLOCK: ${START_BLOCK:-}
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - explorer-network

  # API Service
  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: explorer-api
    ports:
      - "4000:3000"
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL}
      PORT: 3000
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - explorer-network

  # Frontend Application
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    container_name: explorer-frontend
    ports:
      - "4001:5173"
    depends_on:
      - api
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - explorer-network

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local

networks:
  explorer-network:
    driver: bridge

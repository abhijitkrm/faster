services:
  # PostgreSQL Database
  postgresql:
    image: postgres:15-alpine
    container_name: faster-postgresql
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explorer-network

  # Redis Cache & Message Queue
  redis:
    image: redis:7-alpine
    container_name: faster-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - explorer-network

  # Faster: RocksDB hot store + chain indexer + explorer REST/WebSocket API in one process.
  # Replaces fasterindexer + api-go for the explorer; /api/clob/* is proxied to api-go.
  faster:
    build:
      context: ./services/faster
      dockerfile: Dockerfile
    image: faster:faster
    container_name: faster-faster
    ports:
      - "4000:3000"
    environment:
      RPC_URL: ${RPC_URL}
      PORT: 3000
      DATA_DIR: /data
      START_BLOCK: ${START_BLOCK:-0}
      CONFIRMATIONS: ${CONFIRMATIONS:-0}
      REORG_DEPTH: ${REORG_DEPTH:-256}
      FETCH_BATCH: ${FETCH_BATCH:-10}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-16}
      CACHE_MB: ${CACHE_MB:-512}
      CLOB_API_URL: http://api:3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - faster-data:/data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - explorer-network

  # ClickHouse: CLOB history archive (database/clickhouse/*.sql applied on first start)
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: faster-clickhouse
    environment:
      CLICKHOUSE_DB: clob
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clob}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clob}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:8123:8123"
      - "127.0.0.1:9000:9000"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./database/clickhouse:/docker-entrypoint-initdb.d:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
      nproc: 65535
    cap_add:
      - SYS_NICE
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user \"$$CLICKHOUSE_USER\" --password \"$$CLICKHOUSE_PASSWORD\" -q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - explorer-network

  # CLOB archiver: node clob_getBlockArchive -> ClickHouse
  clobarchiver:
    build:
      context: ./services/clobarchiver
      dockerfile: Dockerfile
    image: faster:clobarchiver
    container_name: faster-clobarchiver
    environment:
      NODE_RPC: ${NODE_RPC:-http://host.docker.internal:8545}
      CLICKHOUSE_ADDR: clickhouse:9000
      CLICKHOUSE_DB: clob
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clob}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clob}
      FETCH_WORKERS: ${CLOB_FETCH_WORKERS:-8}
      BATCH_MAX_ROWS: ${CLOB_BATCH_MAX_ROWS:-100000}
      BATCH_MAX_HEIGHTS: ${CLOB_BATCH_MAX_HEIGHTS:-1000}
      POLL_MS: ${CLOB_POLL_MS:-1000}
      START_HEIGHT: ${CLOB_START_HEIGHT:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - explorer-network

  # api-go: CLOB archive API (ClickHouse), reached through faster
  api:
    build:
      context: ./services/api-go
      dockerfile: Dockerfile
    image: faster:api
    container_name: faster-api
    # Internal only: serves /api/clob/* to faster until the CLOB API is ported.
    environment:
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@postgresql:5432/${DB_NAME}
      REDIS_URL: redis://redis:6379
      RPC_URL: ${RPC_URL}
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CLICKHOUSE_ADDR: ${API_CLICKHOUSE_ADDR:-clickhouse:9000}
      CLICKHOUSE_DB: clob
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-clob}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clob}
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - explorer-network

  # Frontend Application
  frontend:
    build:
      context: ./services/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    image: faster:frontend
    container_name: faster-frontend
    ports:
      - "4001:5173"
    depends_on:
      - faster
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    restart: unless-stopped
    networks:
      - explorer-network

volumes:
  faster-data:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  clickhouse-data:
    driver: local

networks:
  explorer-network:
    driver: bridge

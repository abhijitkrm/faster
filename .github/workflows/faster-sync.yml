name: faster-sync

on:
  push:
    branches: [main, dev]
    paths: ["faster-sync/**", ".github/workflows/faster-sync.yml"]
  pull_request:
    paths: ["faster-sync/**", ".github/workflows/faster-sync.yml"]

concurrency:
  group: faster-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faster-sync
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: faster-sync
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --release --workspace

  ts-client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faster-sync/clients/ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: faster-sync/clients/ts/package-lock.json
      - run: npm ci
      - run: npm test

  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: faster-sync
          load: true
          tags: faster-sync:ci
          cache-from: type=gha,scope=faster-sync
          cache-to: type=gha,mode=max,scope=faster-sync
      - name: smoke test (fake chain → ingest → query)
        run: |
          docker run -d --name fakechain --network host faster-sync:ci fakechain 18545 300 200
          docker run -d --name fsync-smoke --network host -e RPC_URL=http://127.0.0.1:18545 -e FINALITY_DEPTH=8 faster-sync:ci
          for i in $(seq 60); do
            h=$(curl -fs http://127.0.0.1:3100/height | python3 -c 'import sys,json;print(json.load(sys.stdin)["height"] or 0)' || echo 0)
            [ "$h" -ge 300 ] && break; sleep 1
          done
          curl -fs http://127.0.0.1:3100/status
          curl -fs -H 'content-type: application/json' http://127.0.0.1:3100/query \
            --data '{"from_block":0,"logs":[{"address":["0xc000000000000000000000000000000000000000"]}],"join":"nothing"}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert len(d["logs"])>0,d;print("logs",len(d["logs"]),"next",d["next_block"])'
      - if: failure()
        run: docker logs fsync-smoke

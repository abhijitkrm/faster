name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  faster:
    name: faster (Rust)
    runs-on: ubuntu-latest
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.8
        env:
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports: ["8123:8123"]
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8123/ping"
          --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: services/faster
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/faster
      - run: cargo fmt --check
      - run: cargo build --locked --all-targets
      - name: tests (incl. ClickHouse CLOB integration)
        run: cargo test --locked
        env:
          CLOB_CH_TEST: "1"
          CLICKHOUSE_URL: http://127.0.0.1:8123
          CLICKHOUSE_USER: ci
          CLICKHOUSE_PASSWORD: ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  clobarchiver:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/clobarchiver
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/clobarchiver/go.mod
          cache-dependency-path: services/clobarchiver/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  images:
    name: docker images
    runs-on: ubuntu-latest
    needs: [faster, frontend, clobarchiver]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
      - name: smoke test (faster image starts and answers /health)
        run: |
          docker run -d --name f -e RPC_URL=http://127.0.0.1:1 faster:faster
          for i in $(seq 1 30); do docker exec f curl -fs http://localhost:3000/health && exit 0; sleep 1; done
          docker logs f; exit 1

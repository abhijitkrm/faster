name: stack

# Brings the whole stack up with ./fasterctl on the demo chain and checks every
# service end to end.
on:
  workflow_call:

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEMO_HEAD: "500"
      DEMO_BLOCK_MS: "500"
      SYNC_FINALITY_DEPTH: "8"
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: ./fasterctl up demo
        run: ./fasterctl up demo
      - name: wait for faster-sync to pass block 400
        run: |
          for i in $(seq 120); do
            h=$(curl -fs localhost:3100/height | python3 -c 'import sys,json;print(json.load(sys.stdin)["height"] or 0)' || echo 0)
            [ "$h" -ge 400 ] && break; sleep 2
          done
          echo "faster-sync height $h"; test "$h" -ge 400
      - name: faster-sync query
        run: |
          curl -fs -H 'content-type: application/json' localhost:3100/query \
            --data '{"from_block":0,"logs":[{"address":["0xc000000000000000000000000000000000000000"]}],"join":"nothing"}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["logs"],d;print("logs",len(d["logs"]))'
      - name: faster-rpc
        run: |
          for i in $(seq 30); do curl -fs localhost:8545/health && break; sleep 2; done
          curl -fs -XPOST localhost:8545 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["0x10",false]}' \
            | python3 -c 'import sys,json;d=json.load(sys.stdin);assert d["result"]["number"]=="0x10",d;print("block",d["result"]["hash"])'
      - name: explorer (UI + API through nginx)
        run: |
          for i in $(seq 60); do curl -fs localhost:4000/health && break; sleep 2; done
          curl -fs localhost:4000/ | grep -qi '<html'
          curl -fs 'localhost:4000/api/blocks' | head -c 300; echo
      - name: faster-index GraphQL
        run: |
          for i in $(seq 60); do curl -fs localhost:8080/healthz && break; sleep 2; done
          curl -fs localhost:8080/graphql -H 'content-type: application/json' \
            -d '{"query":"{ _meta { chains { chainId nextBlock } } }"}'
      - run: ./fasterctl status
      - if: failure()
        run: docker compose --profile '*' ps -a; docker compose --profile '*' logs --tail 80
      - if: always()
        run: ./fasterctl down -v

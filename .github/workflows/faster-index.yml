name: faster-index

on:
  push:
    branches: [main, dev]
    paths: ["faster-index/**", ".github/workflows/faster-index.yml"]
  pull_request:
    paths: ["faster-index/**", ".github/workflows/faster-index.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 20
    defaults:
      run:
        working-directory: faster-index
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: faster-index/package-lock.json
      - run: npm ci
      - run: npm test
      - name: tests against Postgres
        run: node --test test/*.test.mjs
        env:
          TEST_DATABASE_URL: postgres://postgres:ci@127.0.0.1:5432/postgres
      - name: example codegen + typecheck
        run: |
          cd examples/erc20 && npm install --no-audit --no-fund
          npx faster-index codegen
          node --input-type=module -e "await import('./src/handlers.ts'); console.log('handlers load')"

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t faster-index:ci faster-index
      - run: docker run --rm faster-index:ci faster-index codegen

name: faster-rpc

on:
  workflow_call:

jobs:
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: faster-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: faster-rpc
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release

  docker:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: faster-rpc
          load: true
          tags: faster-rpc:ci
          cache-from: type=gha,scope=faster-rpc
          cache-to: type=gha,mode=max,scope=faster-rpc
      - name: smoke test (starts without faster-sync, answers health)
        run: |
          docker run -d --name frpc --network host -e SYNC_URL=http://127.0.0.1:1 faster-rpc:ci
          for i in $(seq 20); do curl -fs http://127.0.0.1:8545/health && break; sleep 1; done
          curl -fs -X POST http://127.0.0.1:8545 -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"web3_clientVersion","params":[]}'

name: release

# Tag vX.Y.Z on main: runs every check (checks.yml), then builds the stack's
# binaries for Linux and macOS, attaches them to the GitHub release, and pushes
# the images to ghcr.io/<owner>/<name>:<tag>. Nothing is published unless all
# checks pass. This is the only workflow that runs automatically.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  binaries:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: macos-14, target: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang libclang-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: build
        run: |
          name=faster-${GITHUB_REF_NAME}-${{ matrix.target }}
          ./fasterctl build "dist/$name"
          cp README.md docker-compose.yml .env.example "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz

  images:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: faster-explorer, context: faster-explorer/services/faster }
          - { name: faster-explorer-frontend, context: faster-explorer/services/frontend }
          - { name: faster-clobarchiver, context: faster-explorer/services/clobarchiver }
          - { name: faster-sync, context: faster-sync }
          - { name: faster-rpc, context: faster-rpc }
          - { name: faster-index, context: faster-index }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.ref_name }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  release:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: attach binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist/*.tar.gz

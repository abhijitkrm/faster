[package]
name = "faster"
version = "0.1.0"
edition = "2021"
description = "Faster explorer: RocksDB hot store, chain indexer and explorer API in one process"
publish = false
default-run = "faster"

[dependencies]
alloy-dyn-abi = "1"
alloy-json-abi = "1"
alloy-primitives = "1"
anyhow = "1"
arc-swap = "1"
axum = { version = "0.8", features = ["ws"] }
bincode = "1.3"
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }
ruint = "1.12"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_urlencoded = "0.7"
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tower-http = { version = "0.6", features = ["timeout"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[package]
name = "faster-sync"
version = "0.1.0"
edition = "2021"
description = "Bulk historical EVM data: immutable Parquet chunks with per-row-group filters, a RocksDB hot tail, one query API"
license = "UNLICENSED"
publish = false
default-run = "faster-sync"

[lib]
name = "faster_sync"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false, features = ["ipc", "ipc_compression"] }
axum = "0.8"
bincode = "1.3"
bytes = "1"
futures = "0.3"
hex = "0.4"
lru = "0.16"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "lz4"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "net", "fs"] }
tower-http = { version = "0.6", features = ["timeout", "compression-gzip", "compression-zstd"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
xorf = { version = "0.13", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
